<svg viewBox="0 0 300 350" xmlns="http://www.w3.org/2000/svg" style="max-width: 100%; height: auto;">
  <defs>
    <style>
      @keyframes wave {
        0%, 100% { transform: rotate(0deg); transform-origin: 85% 20%; }
        50% { transform: rotate(25deg); transform-origin: 85% 20%; }
      }
      @keyframes bounce {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-10px); }
      }
      .hand { animation: wave 0.8s ease-in-out infinite; }
      .body { animation: bounce 2s ease-in-out infinite; }
    </style>
  </defs>
  
  <!-- Background classroom elements -->
  <rect x="10" y="10" width="280" height="330" fill="#e8f4f8" rx="20" opacity="0.3"/>
  
  <!-- Whiteboard -->
  <rect x="220" y="40" width="60" height="50" fill="#f5f5f5" stroke="#333" stroke-width="2" rx="4"/>
  <circle cx="235" cy="55" r="3" fill="#e74c3c"/>
  <circle cx="250" cy="65" r="3" fill="#3498db"/>
  <circle cx="265" cy="58" r="3" fill="#f39c12"/>
  
  <!-- Potted plant -->
  <ellipse cx="35" cy="280" rx="20" ry="10" fill="#8b4513"/>
  <rect x="28" y="270" width="14" height="12" fill="#8b4513"/>
  <circle cx="30" cy="265" r="5" fill="#27ae60"/>
  <circle cx="42" cy="268" r="6" fill="#27ae60"/>
  <circle cx="45" cy="258" r="5" fill="#27ae60"/>
  <circle cx="35" cy="255" r="5" fill="#27ae60"/>
  
  <!-- Head with class="body" for bounce animation -->
  <g class="body">
    <!-- Hair -->
    <ellipse cx="150" cy="70" rx="35" ry="40" fill="#8b6f47"/>
    
    <!-- Face -->
    <circle cx="150" cy="80" r="32" fill="#f4a460"/>
    
    <!-- Eyes -->
    <circle cx="138" cy="72" r="4" fill="#333"/>
    <circle cx="162" cy="72" r="4" fill="#333"/>
    <circle cx="140" cy="70" r="1.5" fill="#fff"/>
    <circle cx="164" cy="70" r="1.5" fill="#fff"/>
    
    <!-- Smile -->
    <path d="M 138 85 Q 150 93 162 85" stroke="#333" stroke-width="2" fill="none" stroke-linecap="round"/>
    
    <!-- Rosy cheeks -->
    <circle cx="125" cy="80" r="4" fill="#ffb6c1" opacity="0.6"/>
    <circle cx="175" cy="80" r="4" fill="#ffb6c1" opacity="0.6"/>
  </g>
  
  <!-- Neck -->
  <rect x="145" y="108" width="10" height="8" fill="#f4a460"/>
  
  <!-- Body/Dress -->
  <g class="body">
    <!-- Dress -->
    <path d="M 130 116 L 125 180 Q 125 195 135 195 L 165 195 Q 175 195 175 180 L 170 116 Z" fill="#2563eb" stroke="#1e40af" stroke-width="1"/>
    
    <!-- Dress pattern (stripes) -->
    <line x1="135" y1="125" x2="165" y2="125" stroke="#60a5fa" stroke-width="1" opacity="0.5"/>
    <line x1="135" y1="140" x2="165" y2="140" stroke="#60a5fa" stroke-width="1" opacity="0.5"/>
    <line x1="135" y1="155" x2="165" y2="155" stroke="#60a5fa" stroke-width="1" opacity="0.5"/>
    <line x1="135" y1="170" x2="165" y2="170" stroke="#60a5fa" stroke-width="1" opacity="0.5"/>
    
    <!-- Left Arm -->
    <line x1="130" y1="125" x2="105" y2="140" stroke="#f4a460" stroke-width="8" stroke-linecap="round"/>
    
    <!-- Right Arm (the waving hand) -->
    <g class="hand">
      <line x1="170" y1="125" x2="195" y2="110" stroke="#f4a460" stroke-width="8" stroke-linecap="round"/>
      <!-- Hand/Fingers -->
      <circle cx="200" cy="105" r="12" fill="#f4a460"/>
      <path d="M 205 98 L 208 90" stroke="#f4a460" stroke-width="2" stroke-linecap="round"/>
      <path d="M 208 97 L 213 87" stroke="#f4a460" stroke-width="2" stroke-linecap="round"/>
      <path d="M 205 103 L 213 105" stroke="#f4a460" stroke-width="2" stroke-linecap="round"/>
    </g>
  </g>
  
  <!-- Left leg -->
  <line x1="140" y1="195" x2="138" y2="260" stroke="#f4a460" stroke-width="7" stroke-linecap="round"/>
  <!-- Left shoe -->
  <ellipse cx="138" cy="268" rx="8" ry="6" fill="#333"/>
  
  <!-- Right leg -->
  <line x1="160" y1="195" x2="162" y2="260" stroke="#f4a460" stroke-width="7" stroke-linecap="round"/>
  <!-- Right shoe -->
  <ellipse cx="162" cy="268" rx="8" ry="6" fill="#333"/>
  
  <!-- Socks -->
  <rect x="133" y="255" width="10" height="8" fill="#f5f5f5"/>
  <rect x="157" y="255" width="10" height="8" fill="#f5f5f5"/>
  
  <!-- Book/Clipboard in left hand -->
  <rect x="95" y="145" width="18" height="22" fill="#d32f2f" stroke="#b71c1c" stroke-width="1" rx="2"/>
  <line x1="97" y1="155" x2="111" y2="155" stroke="#fff" stroke-width="1"/>
  <line x1="97" y1="160" x2="111" y2="160" stroke="#fff" stroke-width="1"/>
  <line x1="97" y1="165" x2="111" y2="165" stroke="#fff" stroke-width="1"/>
  
  <!-- Apple on desk (cute touch) -->
  <circle cx="250" cy="240" r="8" fill="#e74c3c"/>
  <rect x="248" y="228" width="1.5" height="12" fill="#8b4513"/>
  <ellipse cx="250" cy="226" rx="3" ry="2" fill="#27ae60"/>
  
  <!-- Decorative stars around -->
  <polygon points="280,60 283,68 292,68 286,73 289,81 280,76 271,81 274,73 268,68 277,68" fill="#f39c12" opacity="0.7"/>
  <polygon points="40,50 42,56 49,56 44,60 46,66 40,62 34,66 36,60 31,56 38,56" fill="#3498db" opacity="0.6"/>
</svg>
